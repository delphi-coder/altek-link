; ALTEK Link Windows settings reference.
; The application reads the live file from:
;   %LOCALAPPDATA%\ALTEK-Link\settings.ini
; Restart ALTEK Link after manually changing a screen_* value.

[settings]
; Device name advertised to peers. Blank is not recommended.
name=ALTEK-Link
; SHA-256 avatar identifier. Leave blank when no avatar is configured.
avatar=
; Destination folder for received files; blank uses the application data folder.
receive_dir=

; Minimize ALTEK Link before an accepted incoming desktop share starts capture.
minimize_screen_share=1
; Incoming remote pinch: 0=enabled, 1=disabled on desktop, 2=disabled everywhere.
remote_pinch_mode=0
; Camera index and camera-video encoder settings.
camera=0
width=320
height=240
fps=15
bitrate=4000000
; Rotation applied to received camera video: 0, 90, 180, or 270.
rx_rotate=90
; UI theme: 0=green, 1=petrol blue.
theme=0

; Screen encoder output size. 0/0 means the native desktop size.
; When set explicitly, both values must be even and at least 16.
screen_width=0
screen_height=0
; Screen frames per second: 1..60.
screen_fps=8
; Target/maximum working bitrate in bits per second: 50000..20000000.
; OpenH264 still uses this value while quality rate control is selected.
screen_bitrate=4000000
; Rate control: 1=quality (recommended/default), 0=bitrate.
screen_quality=1
; I-frame interval in frames: 1..3600. 8 means once per second at 8 fps.
screen_iframe=8
; OpenH264 encoder threads: 0=automatic, 1=single-threaded, 2..16=thread count.
screen_threads=1
; Permit the encoder to skip frames to maintain rate control: 1=yes, 0=no.
screen_frame_skip=1
